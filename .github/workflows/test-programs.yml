name: Compile and run lab programs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ openmpi-bin libopenmpi-dev
      - name: Compile OpenMP programs
        run: |
          set -eux
          g++ -std=c++17 -O2 -Wall -Wextra -fopenmp "OpenMP Pi Calculation/1.cpp" -o /tmp/1
          g++ -std=c++17 -O2 -Wall -Wextra -fopenmp "OpenMP Largest Element/2.cpp" -o /tmp/2
          g++ -std=c++17 -O2 -Wall -Wextra -fopenmp "OpenMP Prime Number Generation/3.cpp" -o /tmp/3
          g++ -std=c++17 -O2 -Wall -Wextra -fopenmp "OpenMP Producer Consumer/9.cpp" -o /tmp/9
          g++ -std=c++17 -O2 -Wall -Wextra -fopenmp "OpenMP Matrix Multiplication/10.cpp" -o /tmp/10
      - name: Run OpenMP programs
        run: |
          set -eux
          OMP_NUM_THREADS=4 timeout 30s /tmp/1
          OMP_NUM_THREADS=4 timeout 30s /tmp/2
          printf '100\n' | OMP_NUM_THREADS=4 timeout 30s /tmp/3
          OMP_NUM_THREADS=2 timeout 30s /tmp/9
          OMP_NUM_THREADS=4 timeout 30s /tmp/10
      - name: Compile MPI programs
        run: |
          set -eux
          mpic++ -std=c++17 -O2 -Wall -Wextra "MPI Pi Calculation/4.cpp" -o /tmp/4
          mpic++ -std=c++17 -O2 -Wall -Wextra "MPI Ring Communication/5.cpp" -o /tmp/5
          mpic++ -std=c++17 -O2 -Wall -Wextra "MPI Trapezoidal Rule Integration/6.cpp" -o /tmp/6
          mpic++ -std=c++17 -O2 -Wall -Wextra "MPI Odd-Even Transposition Sort/7.cpp" -o /tmp/7
          mpic++ -std=c++17 -O2 -Wall -Wextra "MPI Hyperquicksort/8.cpp" -o /tmp/8
      - name: Run MPI programs
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
        run: |
          set -eux
          for f in 4 5 6 7 8; do
            timeout 30s mpirun --oversubscribe -np 4 "/tmp/$f"
          done
